name: WMO tracks + hazards (daily)

on:
  schedule:
    - cron: "15 0 * * *"   # 00:15 UTC daily
  workflow_dispatch:

concurrency:
  group: wmo-tracks-daily
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System libraries (terra / netcdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev gdal-bin \
            libgeos-dev \
            libproj-dev proj-data proj-bin \
            libudunits2-dev \
            libnetcdf-dev netcdf-bin \
            libjpeg-dev \
            libpng-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install deps
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 5
          extra-packages: |
            any::rjson
            any::terra
            any::htmltools
            any::viridisLite
            any::raster
            any::TCHazaRds
            any::leaflet
            any::rmarkdown
            any::knitr

      - name: Run script
        env:
          OUTDIR: outputs/latest
          SAVE_NC: 1
          SAVE_TIF: 0
        run: |
          Rscript scripts/wmo_tracks_daily.R

      - name: Render report (HTML)
        shell: bash
        run: |
          mkdir -p docs
          touch docs/.nojekyll
          if [ -f outputs/latest/index.csv ]; then
            Rscript -e "rmarkdown::render('reports/haz_leaflet.Rmd', output_file='index.html', output_dir='docs', knit_root_dir=getwd(), params=list(outdir='outputs/latest'), output_options=list(self_contained=FALSE, lib_dir='site_libs'))" \
              || echo "<html><head><meta charset='utf-8'><title>Cyclone Ocean Waves</title></head><body><h2>Report render failed</h2><p>See Actions logs for details.</p></body></html>" > docs/index.html
          else
            echo "<html><head><meta charset='utf-8'><title>Cyclone Ocean Waves</title></head><body><h2>No outputs yet</h2><p>outputs/latest/index.csv not found.</p></body></html>" > docs/index.html
          fi

      - name: Commit outputs + report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/latest docs
          git commit -m "Daily WMO hazards update" || echo "No changes to commit"
          git push
