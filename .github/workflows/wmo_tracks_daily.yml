name: WMO tracks + hazards (daily)

on:
  schedule:
    # 00:15 UTC daily (10:15 Melbourne during AEDT; 11:15 during AEST)
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: wmo-tracks-daily
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System libraries (terra + jpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y             gdal-bin libgdal-dev libproj-dev libgeos-dev             libudunits2-dev libnetcdf-dev libjpeg-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install deps
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rjson
            any::terra
            any::TCHazaRds

      - name: Run script
        env:
          OUTDIR: outputs/latest
          # MAX_TC: 2   # uncomment for quick testing
        run: |
          Rscript scripts/wmo_tracks_daily.R

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/latest
          git commit -m "Daily WMO tracks update" || echo "No changes to commit"
          git push
