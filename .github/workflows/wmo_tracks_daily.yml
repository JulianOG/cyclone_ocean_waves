name: WMO tracks + hazards (daily)

on:
  schedule:
    # 00:15 UTC daily (10:15 Melbourne during AEDT; 11:15 during AEST)
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: wmo-tracks-daily
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System libraries (terra / netcdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y             gdal-bin libgdal-dev libproj-dev libgeos-dev             libudunits2-dev libnetcdf-dev libjpeg-dev

      - name: Setup R (use binaries where possible)
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install deps (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: |
            any::rjson
            any::terra
            any::TCHazaRds
            any::leaflet
            any::leafem
            any::rmarkdown
            any::knitr

      - name: Run script
        env:
          OUTDIR: outputs/latest
          SAVE_NC: 1
          SAVE_TIF: 0
          # MAX_TC: 2
        run: |
          Rscript scripts/wmo_tracks_daily.R

      - name: Render report (HTML)
        shell: bash
        run: |
          mkdir -p docs
          if [ -f outputs/latest/index.csv ]; then
            Rscript -e "rmarkdown::render('reports/haz_leaflet.Rmd', output_file='index.html', output_dir='docs', params=list(outdir='outputs/latest'))"
          else
            echo "<html><head><meta charset='utf-8'><title>Cyclone Ocean Waves</title></head><body><h2>No outputs yet</h2><p>outputs/latest/index.csv not found.</p></body></html>" > docs/index.html
          fi

      - name: Commit outputs + report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/latest docs
          git commit -m "Daily WMO hazards update" || echo "No changes to commit"
          git push
