name: WMO tracks + hazards (daily)

track_color: "#2d3748"
forecast_track_color: "#198754"

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: wmo-tracks-daily
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: System libraries (terra / sf / netcdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            libproj-dev \
            libgeos-dev \
            libudunits2-dev \
            libnetcdf-dev \
            libjpeg-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install deps (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 10
          extra-packages: |
            any::rjson
            any::terra
            any::TCHazaRds
            any::leaflet
            any::htmlwidgets
            any::htmltools
            any::lutz
            any::viridisLite
            any::rmarkdown
            any::knitr
            any::sf
            any::tibble

      - name: Run script
        env:
          OUTDIR: outputs/latest
          SAVE_NC: 0
          SAVE_TIF: 1
          SAVE_SUMMARY: 1
        run: |
          Rscript scripts/wmo_tracks_daily.R

      - name: Render reports (HTML)
        shell: bash
        run: |
          mkdir -p docs
          touch docs/.nojekyll

          if [ -f outputs/latest/index.csv ]; then
            if ! Rscript -e "rmarkdown::render('reports/haz_leaflet_coast_query_points.Rmd', output_file='index.html', output_dir='docs')"; then
              printf '%s\n'                 '<!doctype html>'                 '<html>'                 '<head><meta charset="utf-8"><title>Cyclone Ocean Waves</title></head>'                 '<body>'                 '<h1>Cyclone Ocean Waves</h1>'                 '<h2>Report render failed</h2>'                 '<p>See the GitHub Actions logs for details.</p>'                 '</body>'                 '</html>' > docs/index.html
            fi

            if ! Rscript -e "rmarkdown::render('reports/haz_leaflet.Rmd', output_file='index_raw.html', output_dir='docs')"; then
              printf '%s\n'                 '<!doctype html>'                 '<html>'                 '<head><meta charset="utf-8"><title>Cyclone Ocean Waves</title></head>'                 '<body>'                 '<h1>Cyclone Ocean Waves</h1>'                 '<h2>Raw report render failed</h2>'                 '<p>See the GitHub Actions logs for details.</p>'                 '</body>'                 '</html>' > docs/index_raw.html
            fi
          else
            printf '%s\n'               '<!doctype html>'               '<html>'               '<head><meta charset="utf-8"><title>Cyclone Ocean Waves</title></head>'               '<body>'               '<h1>Cyclone Ocean Waves</h1>'               '<h2>No outputs yet</h2>'               '<p><code>outputs/latest/index.csv</code> was not found.</p>'               '</body>'               '</html>' > docs/index.html

            printf '%s\n'               '<!doctype html>'               '<html>'               '<head><meta charset="utf-8"><title>Cyclone Ocean Waves</title></head>'               '<body>'               '<h1>Cyclone Ocean Waves</h1>'               '<h2>No outputs yet</h2>'               '<p><code>outputs/latest/index.csv</code> was not found.</p>'               '</body>'               '</html>' > docs/index_raw.html
          fi

      - name: Commit outputs + report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -f outputs/latest/haz_*.nc outputs/latest/haz_*.tif || true

          git add outputs/latest docs .github/workflows/wmo_tracks_daily.yml reports/haz_leaflet_coast_query_points.Rmd reports/haz_leaflet.Rmd
          git commit -m "Daily WMO hazards update" || echo "No changes to commit"
          git push
